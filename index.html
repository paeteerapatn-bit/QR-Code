<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังนำทาง...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>

  <script>
    // =========================================================================
    // [ตั้งค่าตรงนี้] ใส่ลิงก์ปลายทางจริงเมื่อพร้อมใช้งาน 
    // หากยังไม่มีลิงก์ ให้ปล่อยเป็นค่าว่าง "" ระบบจะแสดงหน้าแจ้งเตือน "ยังไม่เปิดใช้งาน"
    // =========================================================================
    const TARGET_URL = ""; 
    // ตัวอย่างเมื่อได้ลิงก์แล้ว: const TARGET_URL = "https://www.google.com";

    // ระบบเด้งไปหน้าปลายทางอัตโนมัติ (ทำงานทันทีเมื่อมีลิงก์)
    if (TARGET_URL && TARGET_URL.trim() !== "") {
      window.location.replace(TARGET_URL);
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <!-- หน้าจอนี้จะแสดงเฉพาะตอนที่ TARGET_URL ยังเป็นค่าว่าง "" -->
  <div id="statusBox" class="bg-white max-w-sm w-full rounded-2xl shadow-md p-8 text-center border border-slate-200">
    <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>
    <h1 class="text-xl font-bold text-slate-800 mb-2">อยู่ระหว่างเตรียมข้อมูล</h1>
    <p class="text-sm text-slate-600 leading-relaxed mb-6">
      ลิงก์ปลายทางสำหรับ QR Code นี้ยังไม่เปิดให้เข้าถึงในขณะนี้ กรุณาสแกนใหม่อีกครั้งในภายหลัง
    </p>
    <div class="text-xs text-slate-400">
      ระบบพร้อมทำงานทันทีเมื่ออัปเดตลิงก์ปลายทาง
    </div>
  </div>

  <script>
    // หากมีลิงก์แล้ว ให้เปลี่ยนข้อความระหว่างรอโหลดหน้าใหม่ (กันหน้าจอกระพริบ)
    if (TARGET_URL && TARGET_URL.trim() !== "") {
      document.getElementById('statusBox').innerHTML = `
        <div class="py-6">
          <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-4"></div>
          <p class="text-slate-700 font-semibold">กำลังพาคุณไปยังหน้าปลายทาง...</p>
          <p class="text-xs text-slate-400 mt-2">หากไม่เปลี่ยนหน้าอัตโนมัติ <a href="${TARGET_URL}" class="text-blue-600 underline">คลิกที่นี่</a></p>
        </div>
      `;
    }
  </script>

</body>
</html>
